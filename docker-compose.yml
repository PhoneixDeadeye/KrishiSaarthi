version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: krishisaarthi-backend
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:80}
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-krishiuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-krishisaarthi}}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - krishisaarthi-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: krishisaarthi-celery-worker
    command: celery -A KrishiSaarthi worker -l info --concurrency=2
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-krishiuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-krishisaarthi}}
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
      - backend
    networks:
      - krishisaarthi-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: krishisaarthi-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - krishisaarthi-network

  db:
    image: postgres:15-alpine
    container_name: krishisaarthi-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-krishisaarthi}
      - POSTGRES_USER=${POSTGRES_USER:-krishiuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - krishisaarthi-network

  redis:
    image: redis:7-alpine
    container_name: krishisaarthi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - krishisaarthi-network

volumes:
  postgres_data:
  redis_data:
